name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: הורדת הקבצים מהמאגר
        uses: actions/checkout@v4

      - name: התקנת Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: התקנת Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: פתיחת קובץ ה-ZIP של הפרויקט
        run: |
          mkdir -p src
          unzip -q maslul-android.zip -d src
          ls src/maslul-android

      - name: בניית ה-APK
        working-directory: src/maslul-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: שמירת ה-APK להורדה
        uses: actions/upload-artifact@v4
        with:
          name: maslul-apk
          path: src/maslul-android/app/build/outputs/apk/debug/app-debug.apk
